name: Probe (temporary)
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe practice.qabrains.com endpoints
        run: |
          B=https://practice.qabrains.com
          probe() { echo "######## $1 $2  body=$3"; curl -s -o body.txt -D h.txt -X "$1" "$B$2" -H 'Content-Type: application/json' -H 'Accept: application/json' ${3:+--data "$3"} -w 'HTTP %{http_code} %{content_type} %{size_download}B\n'; grep -iE '^(location|set-cookie|allow):' h.txt | cut -c1-120; head -c 400 body.txt | tr '\n' ' '; echo; }
          probe GET  /api/login ''
          probe POST /api/login '{"email":"test@qabrains.com","password":"Password123"}'
          probe POST /api/login '{"email":"qa_testers@qabrains.com","password":"Password123"}'
          probe POST /api/login '{"email":"wrong@x.com","password":"nope"}'
          probe PUT  /api/login '{"name":"Updated Name"}'
          probe POST /api/register '{"name":"RB","country":"Bangladesh","account":"Engineer","email":"ci.probe@example.com","password":"Password123","confirm_password":"Password123"}'
          probe POST /forgot-password '{"email":"test@qabrains.com"}'
          probe POST /ecommerce-site '{"email":"test@qabrains.com","password":"Password123"}'
          probe GET  /api/users ''
          probe GET  /api/products ''
          probe POST /api/ecommerce/login '{"email":"test@qabrains.com","password":"Password123"}'
